<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agentd</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <aside id="side">
    <div class="side-top">
      <div class="proj-row">
        <select id="project" aria-label="当前项目"></select>
        <button id="btn-newproj" class="icon" title="新建项目" aria-label="新建项目">＋</button>
        <button id="btn-projmenu" class="icon" title="项目操作" aria-label="项目操作">⋯</button>
      </div>
      <div id="projmenu" class="pop" hidden>
        <button id="btn-stop">关闭项目<small>停掉所有进程，配置和会话保留</small></button>
        <button id="btn-delete" class="danger">删除项目<small>移除配置，目录里的文件不动</small></button>
      </div>
      <form id="form-project" class="pop" hidden>
        <input name="id" placeholder="项目 id，例如 shop" required autocomplete="off">
        <input name="name" placeholder="显示名（可不填）" autocomplete="off">
        <input name="root" placeholder="根目录，绝对路径，需已存在" required autocomplete="off">
        <div class="pop-actions"><button type="button" class="ghost" id="cancel-project">取消</button><button class="primary">创建项目</button></div>
      </form>
    </div>

    <nav id="members" aria-label="成员"></nav>

    <div class="side-bottom">
      <button id="btn-newmember" class="ghost wide">＋ 新建执行者</button>
      <div id="limits" class="dim"></div>
      <div id="conn" class="dim">连接中…</div>
    </div>
  </aside>

  <main id="chat">
    <header id="chat-head">
      <div class="head-main">
        <h1 id="head-title">&nbsp;</h1>
        <div id="head-tag"></div>
      </div>
      <div class="head-side">
        <span id="head-state" class="dim"></span>
        <button id="btn-retry" class="ghost" hidden>重试启动</button>
        <button id="btn-settings" class="ghost">设置</button>
      </div>
    </header>

    <div id="stream" tabindex="-1" aria-live="polite"></div>

    <form id="composer">
      <textarea id="input" rows="1" placeholder="" aria-label="消息"></textarea>
      <button type="button" id="btn-abort" class="ghost" hidden>中断</button>
      <button id="btn-send" class="primary">发送</button>
    </form>
  </main>

  <aside id="drawer" hidden aria-label="设置"></aside>
</div>

<dialog id="dlg-member">
  <form id="form-member" method="dialog">
    <h2>新建执行者</h2>
    <p class="dim">执行者是一个固定在项目某个目录里的 CLI 进程。创建时只写配置，第一次用到才会启动。</p>
    <label>名称<input name="id" placeholder="例如 dsh-backend" required autocomplete="off"></label>
    <div class="two">
      <label>CLI<select name="type" id="m-type"></select></label>
      <label>目录<input name="dir" id="m-dir" placeholder="相对项目根目录，例如 ./server" required autocomplete="off"></label>
    </div>
    <label>用途<input name="role" placeholder="调度器据此挑人，例如 后端服务" autocomplete="off"></label>
    <div class="two">
      <label>模型<select name="model" id="m-model"><option value="">默认</option></select></label>
      <label>会话<select name="sessionId" id="m-session"><option value="new">新建会话</option></select></label>
    </div>
    <div class="dlg-actions">
      <button type="button" class="ghost" id="cancel-member">取消</button>
      <button class="primary">创建执行者</button>
    </div>
  </form>
</dialog>

<div id="toast" role="status"></div>
<script type="module" src="app.js"></script>
</body>
</html>
